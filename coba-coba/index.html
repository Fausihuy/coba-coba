<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Data Diri (Pure HTML)</title>
</head>
<body>

    <h2>Form Profil User</h2>

    <form action="#" method="POST">
        <div>
            <label for="nama">Nama Lengkap:</label><br>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>
        </div>
        <br>

        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Masukkan password" required>
        </div>
        <br>

        <div>
            <label for="tgl_lahir">Tanggal Lahir:</label><br>
            <input type="date" id="tgl_lahir" name="tgl_lahir" required>
        </div>
        <br>

        <div>
            <label for="hobi">Hobi:</label><br>
            <input type="text" id="hobi" name="hobi" placeholder="Contoh: Membaca, Game, Coding">
        </div>
        <br>

        <div>
            <label for="keterangan">Keterangan:</label><br>
            <textarea id="keterangan" name="keterangan" rows="4" cols="30" placeholder="Tambahkan catatan atau bio singkat..."></textarea>
        </div>
        <br>

        <button type="submit">Simpan Data</button>
    </form>

</body>
</html>
